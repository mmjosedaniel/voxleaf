[project]
name = "voxleaf-benchmark-chatterbox-multilingual-v3-v3"
version = "0.0.0"
description = "Corrected CUDA benchmark environment for Chatterbox Multilingual V3"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2",
    "torch==2.6.0",
    "torchaudio==2.6.0",
]

[tool.uv]
exclude-newer = "2026-07-29T00:00:00Z"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
