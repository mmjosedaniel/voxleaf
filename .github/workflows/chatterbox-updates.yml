name: Chatterbox dependency candidates

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/chatterbox-updates.yml"
      - "scripts/chatterbox-update-candidate.py"

permissions:
  contents: read

jobs:
  candidates:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.29
          enable-cache: false
      - name: Resolve Windows candidate and verify tracked inputs
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python scripts/chatterbox-update-candidate.py "$env:RUNNER_TEMP/chatterbox-proposal"
          git diff --exit-code
      - name: Retain proposed requirements and lock for seven days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chatterbox-proposal
          path: ${{ runner.temp }}/chatterbox-proposal
          retention-days: 7
          if-no-files-found: error
