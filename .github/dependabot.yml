version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Bogota
    open-pull-requests-limit: 4
    labels:
      - dependencies
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      production-node:
        dependency-type: production
      development-node:
        dependency-type: development

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Bogota
    open-pull-requests-limit: 4
    labels:
      - dependencies

  - package-ecosystem: uv
    directory: /services/tts
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Bogota
    open-pull-requests-limit: 4
    labels:
      - dependencies

  - package-ecosystem: uv
    directory: /services/tts/release/core
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/Bogota
    open-pull-requests-limit: 4
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:15"
      timezone: America/Bogota
    open-pull-requests-limit: 4
    labels:
      - dependencies
